<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshRoute design tokens</title>
<link rel="stylesheet" href="../design-tokens.css">
<style>body{margin:0;padding:24px;background:var(--fr-bg);color:var(--fr-ink);font:16px/1.4 var(--fr-font)}h1,h2{font-family:var(--fr-font-display)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.s{border:1px solid var(--fr-border);border-radius:14px;overflow:hidden;background:var(--fr-surface)}.s i{display:block;height:64px}.s div{padding:8px 10px;font-size:13px}code{font-size:12px}button{min-height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--fr-primary);background:var(--fr-primary);color:var(--fr-on-primary);font:700 16px var(--fr-font)}</style>
<h1>FreshRoute tokens</h1><p>Toggle: <button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Light / dark</button></p>
<div class="g" id="g"></div><h2>Type</h2><p style="font:700 28px var(--fr-font-display)">Display: Georgia stack - Viazi mviringo, KES 2,700</p><p>Body: system UI stack, 18px mobile / 16px desktop. No web fonts (low bandwidth).</p>
<script>const n=['bg','surface','surface-2','ink','ink-2','line','border','primary','clay','sun','official','user','ok','warn','danger','focus'];document.getElementById('g').innerHTML=n.map(k=>`<div class="s"><i style="background:var(--fr-${k})"></i><div><b>${k}</b><br><code id="v-${k}"></code></div></div>`).join('');
function up(){n.forEach(k=>document.getElementById('v-'+k).textContent=getComputedStyle(document.documentElement).getPropertyValue('--fr-'+k).trim())}up();new MutationObserver(up).observe(document.documentElement,{attributes:true});</script></html>
