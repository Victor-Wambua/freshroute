# CI: runs the project checks on GitHub Actions.
name: ci
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mbstring, pdo_sqlite, gd, exif, fileinfo, intl', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: ./vendor/bin/pest
      - run: composer audit
      - run: npm audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mbstring, pdo_sqlite, gd, exif, fileinfo, intl', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: composer install --no-interaction --prefer-dist && cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
      - run: npx playwright test
